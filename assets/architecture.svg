<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1540" viewBox="0 0 640 1540" role="img" aria-labelledby="title description">
<title id="title">6lowStick architecture: observe, simulate, inspect</title>
<desc id="description">Three separate trust boundaries. Receive-only NOAA SAME and offline Spinel feed observations but do not authorize alert dispatch. An independent synthetic alert fixture passes through an offline policy gate and locally signed notification, uses simulated Thread or direct LoRa, reaches synthetic text, light, and haptic receivers, and produces authenticated application receipts. Receipts are exported as JSON to read-only TUI, ECharts observatory, and Camel evidence exporter. The drawing depicts logical data flow, not physical radios or RF topology.</desc>
