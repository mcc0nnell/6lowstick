name: Native 6lowBang OpenThread
on:
  pull_request:
    paths:
      - 'native/bang/**'
      - 'experiments/bang/**'
      - 'scripts/bang-native-ot.sh'
      - '.github/workflows/bang-native-openthread.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-radio-native-c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 6lowStick
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout pinned OpenThread with mbedTLS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openthread/openthread
          ref: da88541bed383be381c7ea39dc7b98fb9104e03b
          path: openthread-src
          submodules: recursive
          persist-credentials: false
      - name: Verify source pin
        run: test "$(git -C openthread-src rev-parse HEAD)" = da88541bed383be381c7ea39dc7b98fb9104e03b
      - name: Configure native C OpenThread vendor extension
        run: |
          cmake -S openthread-src -B "$RUNNER_TEMP/sixs-native-ot" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DOT_PLATFORM=simulation \
            -DOT_FTD=ON -DOT_RCP=ON -DOT_MTD=OFF \
            -DOT_APP_CLI=ON -DOT_BUILD_EXECUTABLES=ON -DOT_BUILD_GTEST=OFF \
            -DOT_CLI_VENDOR_EXTENSION="$GITHUB_WORKSPACE/native/bang/openthread/vendor-extension.cmake"
      - name: Build native OpenThread UDP source and receiver
        run: cmake --build "$RUNNER_TEMP/sixs-native-ot" --target ot-cli-ftd --parallel 2
      - name: Validate two simulated-radio nodes carrying binary signed C events
        env:
          BANG_OT_BASE_ID: '25'
        run: |
          BANG_NATIVE_OT_CLI="$RUNNER_TEMP/sixs-native-ot/examples/apps/cli/ot-cli-ftd" \
            node experiments/bang/native-ot-lab.mjs
      - name: Exercise application gaps, radio partition and bounded burst
        env:
          BANG_OT_BASE_ID: '25'
          BANG_OT_RESILIENCE: '1'
        run: |
          BANG_NATIVE_OT_CLI="$RUNNER_TEMP/sixs-native-ot/examples/apps/cli/ot-cli-ftd" \
            node experiments/bang/native-ot-lab.mjs
      - name: Compose and verify a bounded binary signed stress matrix
        env:
          BANG_OT_BASE_ID: '25'
          BANG_OT_RESILIENCE: '1'
          BANG_OT_STRESS_MATRIX: '1'
        run: |
          BANG_NATIVE_OT_CLI="$RUNNER_TEMP/sixs-native-ot/examples/apps/cli/ot-cli-ftd" \
            node experiments/bang/native-ot-lab.mjs > "$RUNNER_TEMP/bang-blade-matrix.json"
          python3 scripts/blade-compose-stress.py --verify "$RUNNER_TEMP/bang-blade-matrix.json"
