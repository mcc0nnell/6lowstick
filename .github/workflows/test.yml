name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run site:check
      - name: Validate 6lowSpark A0 KiCad generation and pin map (not ERC)
        run: python3 hardware/6lowspark/a0/check.py
      - name: Validate source release metadata
        run: npm run release:check
      - name: Verify deterministic source archive (never publishes or tags)
        run: |
          npm run release:source
          before="$(sha256sum dist/6lowstick-v0.1.0-rc.1.tar.gz | cut -d' ' -f1)"
          npm run release:source
          after="$(sha256sum dist/6lowstick-v0.1.0-rc.1.tar.gz | cut -d' ' -f1)"
          test "$before" = "$after"
      - name: Verify source archive works WITHOUT Git metadata
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          tar -xzf dist/6lowstick-v0.1.0-rc.1.tar.gz -C "$scratch"
          cd "$scratch/6lowstick-v0.1.0-rc.1"
          test ! -e .git
          npm ci
          npm test
          npm run release:check
      - run: git diff --check
